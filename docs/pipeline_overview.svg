<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#DC2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1F2937">Synthetic Lethal Paralog Screening Pipeline</text>
  
  <!-- DepMap Data Box -->
  <rect x="50" y="60" width="180" height="100" rx="10" fill="url(#grad1)" />
  <text x="140" y="95" text-anchor="middle" fill="white" font-size="14" font-weight="bold">DepMap 25Q3</text>
  <text x="140" y="115" text-anchor="middle" fill="white" font-size="11">CRISPR Dependency</text>
  <text x="140" y="130" text-anchor="middle" fill="white" font-size="11">Mutations</text>
  <text x="140" y="145" text-anchor="middle" fill="white" font-size="11">Expression</text>
  
  <!-- Arrow 1 -->
  <path d="M 230 110 L 280 110" stroke="#6B7280" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  
  <!-- Driver Status Box -->
  <rect x="280" y="60" width="200" height="100" rx="10" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="2"/>
  <text x="380" y="85" text-anchor="middle" fill="#374151" font-size="13" font-weight="bold">Driver Status Detection</text>
  <text x="380" y="105" text-anchor="middle" fill="#6B7280" font-size="10">• LOF Mutations</text>
  <text x="380" y="120" text-anchor="middle" fill="#6B7280" font-size="10">• Low Expression (25%ile)</text>
  <text x="380" y="135" text-anchor="middle" fill="#6B7280" font-size="10">• CNV Deletion</text>
  <text x="380" y="150" text-anchor="middle" fill="#6B7280" font-size="10">• Combined (OR)</text>
  
  <!-- Arrow 2 -->
  <path d="M 480 110 L 530 110" stroke="#6B7280" stroke-width="2" fill="none"/>
  
  <!-- OLS Box -->
  <rect x="530" y="60" width="220" height="100" rx="10" fill="url(#grad2)"/>
  <text x="640" y="85" text-anchor="middle" fill="white" font-size="13" font-weight="bold">OLS Regression</text>
  <text x="640" y="108" text-anchor="middle" fill="white" font-size="10">Dependency ~ Driver_Status</text>
  <text x="640" y="123" text-anchor="middle" fill="white" font-size="10">+ Lineage + Expression</text>
  <text x="640" y="138" text-anchor="middle" fill="white" font-size="10">+ CNV</text>
  <text x="640" y="155" text-anchor="middle" fill="#D1FAE5" font-size="9">(Confounder Adjusted)</text>
  
  <!-- Arrow Down -->
  <path d="M 640 160 L 640 200" stroke="#6B7280" stroke-width="2" fill="none"/>
  
  <!-- FDR Box -->
  <rect x="530" y="200" width="220" height="60" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="640" y="225" text-anchor="middle" fill="#92400E" font-size="13" font-weight="bold">FDR Correction</text>
  <text x="640" y="245" text-anchor="middle" fill="#92400E" font-size="10">Benjamini-Hochberg</text>
  
  <!-- Arrow Down 2 -->
  <path d="M 640 260 L 640 300" stroke="#6B7280" stroke-width="2" fill="none"/>
  
  <!-- Results Box -->
  <rect x="480" y="300" width="320" height="140" rx="10" fill="url(#grad3)"/>
  <text x="640" y="330" text-anchor="middle" fill="white" font-size="14" font-weight="bold">Prioritized SL Pairs</text>
  <text x="640" y="355" text-anchor="middle" fill="white" font-size="11">• Adjusted Coefficient</text>
  <text x="640" y="375" text-anchor="middle" fill="white" font-size="11">• 95% Confidence Interval</text>
  <text x="640" y="395" text-anchor="middle" fill="white" font-size="11">• FDR-corrected p-value</text>
  <text x="640" y="415" text-anchor="middle" fill="white" font-size="11">• Category Classification</text>
  <text x="640" y="432" text-anchor="middle" fill="#FEE2E2" font-size="10">12 Categories | 280+ Pairs</text>
  
  <!-- Paralog DB -->
  <rect x="50" y="200" width="180" height="240" rx="10" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="2"/>
  <text x="140" y="225" text-anchor="middle" fill="#5B21B6" font-size="13" font-weight="bold">Paralog Database</text>
  <text x="140" y="250" text-anchor="middle" fill="#6D28D9" font-size="10">Chromatin (60)</text>
  <text x="140" y="268" text-anchor="middle" fill="#6D28D9" font-size="10">Metabolism (35)</text>
  <text x="140" y="286" text-anchor="middle" fill="#6D28D9" font-size="10">DNA Repair (30)</text>
  <text x="140" y="304" text-anchor="middle" fill="#6D28D9" font-size="10">Kinase (35)</text>
  <text x="140" y="322" text-anchor="middle" fill="#6D28D9" font-size="10">Transcription (30)</text>
  <text x="140" y="340" text-anchor="middle" fill="#6D28D9" font-size="10">Splicing (16)</text>
  <text x="140" y="358" text-anchor="middle" fill="#6D28D9" font-size="10">Ubiquitin (18)</text>
  <text x="140" y="376" text-anchor="middle" fill="#6D28D9" font-size="10">Cell Cycle (15)</text>
  <text x="140" y="394" text-anchor="middle" fill="#6D28D9" font-size="10">RNA Processing (12)</text>
  <text x="140" y="412" text-anchor="middle" fill="#6D28D9" font-size="10">Mitochondria (15)</text>
  <text x="140" y="430" text-anchor="middle" fill="#6D28D9" font-size="10">+ more...</text>
  
  <!-- Arrow from DB -->
  <path d="M 230 320 L 280 320 L 280 230 L 530 230" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="5,5" fill="none"/>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6B7280" />
    </marker>
  </defs>
</svg>
